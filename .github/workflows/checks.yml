name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: node --experimental-vm-modules --test supabase/tests/functions.test.mjs
      - run: node supabase/tests/typecheck.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/thailand-shared-login/index.ts supabase/functions/thailand-delete-content/index.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase test db
      - if: always()
        run: supabase stop
